<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Component showcase for hackert-ui, a React component library split into packages."
    />
    <title>hackert-ui</title>
    <script>
      // Mirrors src/color-scheme.ts so the first paint is already in the right scheme.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("hui-playground-color-scheme");
        } catch (error) {}
        var dark =
          stored === "dark" ||
          (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
